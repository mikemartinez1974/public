name: Generate question-driven explanation idea

on:
  push:
    branches:
      - idea/question-driven-explanation-template

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: idea/question-driven-explanation-template

      - name: Derive idea graph from canonical template
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const sourcePath = 'templates/idea-template/root.node';
          const outputPath = 'ideas/question-driven-explanation-template.node';
          const oldPrefix = 'idea-template';
          const graphId = 'question-driven-explanation-template';
          const title = 'Question-Driven Explanation Template';
          const description = 'Explore a reusable Q&A graph template that explains a subject through question lenses, answers, support, examples, caveats, and synthesis.';
          const now = '2026-08-05T22:14:00.000Z';

          const graph = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const idMap = new Map();
          for (const node of graph.nodes || []) {
            if (typeof node.id === 'string' && node.id.startsWith(oldPrefix)) {
              idMap.set(node.id, graphId + node.id.slice(oldPrefix.length));
            }
          }

          for (const node of graph.nodes || []) {
            if (idMap.has(node.id)) node.id = idMap.get(node.id);
            if (node?.data?.identity?.graphId === oldPrefix) node.data.identity.graphId = graphId;
          }

          for (const edge of graph.edges || []) {
            if (typeof edge.id === 'string' && edge.id.startsWith(oldPrefix)) {
              edge.id = graphId + edge.id.slice(oldPrefix.length);
            }
            if (idMap.has(edge.source)) edge.source = idMap.get(edge.source);
            if (idMap.has(edge.target)) edge.target = idMap.get(edge.target);
          }

          graph.metadata = {
            title,
            description,
            graphId,
            version: '0.1.0',
            kind: 'idea',
            created: now,
            modified: now,
            author: 'Michael Martinez',
            tags: [
              'idea',
              'q-and-a',
              'explanation',
              'template',
              'five-ws-and-how',
              'knowledge-graph'
            ],
            preferredViewer: 'https://twilite.zone'
          };

          const byId = (suffix) => graph.nodes.find((node) => node.id === `${graphId}-${suffix}`);
          const declaration = byId('declaration');
          const rootPort = byId('root-port');
          const instructions = byId('instructions');
          const idea = byId('idea');
          const problem = byId('idea-problem');
          const audience = byId('idea-audience');
          const approach = byId('idea-proposed-approach');
          const question = byId('idea-question');
          const assumption = byId('idea-assumption');
          const research = byId('idea-research');
          const evidence = byId('idea-evidence');
          const alternative = byId('idea-alternative');
          const risk = byId('idea-risk');
          const nextStep = byId('idea-next-step');

          declaration.label = `${title} Declaration`;
          declaration.data.identity = {
            graphId,
            name: title,
            version: '0.1.0',
            description,
            createdAt: now,
            updatedAt: now
          };
          declaration.data.intent = {
            kind: 'idea',
            scope: 'shared',
            artifactKind: 'idea'
          };
          declaration.data.declaration.kind = 'idea';
          declaration.data.declaration.targetMode = 'artifact';
          declaration.data.declaration.artifactKind = 'idea';
          declaration.data.declaration.defaultSurfaceId = 'root';
          declaration.data.declaration.surfaces = [{
            id: 'root',
            kind: 'port',
            label: title,
            memo: 'Canonical entry surface for the question-driven explanation template idea.',
            portNodeId: `${graphId}-root-port`,
            viewNodeId: `${graphId}-root-port`,
            exposes: {
              views: { mode: 'allow' },
              declarations: { mode: 'allow' }
            }
          }];
          declaration.data.dependencies.skills = ['idea-template'];

          rootPort.label = title;
          rootPort.data.identity = {
            graphId,
            portId: 'root',
            name: title
          };
          rootPort.data.title = title;
          rootPort.data.purpose = 'Design a reusable graph grammar for explanations organized by questions, answers, and supporting context.';
          rootPort.data.svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Question-Driven Explanation Template"><defs><linearGradient id="qa-explanation-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".55" stop-color="#164e63"/><stop offset="1" stop-color="#4338ca"/></linearGradient></defs><rect x="5" y="5" width="550" height="310" rx="32" fill="url(#qa-explanation-bg)" stroke="#a5f3fc" stroke-width="3"/><circle cx="280" cy="128" r="43" fill="#0f172a" stroke="#e0f2fe" stroke-width="4"/><text x="280" y="143" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="42" font-weight="850">?</text><g fill="#cffafe" stroke="#155e75" stroke-width="3"><circle cx="145" cy="76" r="24"/><circle cx="415" cy="76" r="24"/><circle cx="118" cy="171" r="24"/><circle cx="442" cy="171" r="24"/><circle cx="190" cy="226" r="24"/><circle cx="370" cy="226" r="24"/></g><g stroke="#a5f3fc" stroke-width="4" stroke-linecap="round"><path d="M166 86l74 28"/><path d="M394 86l-74 28"/><path d="M142 164l94-25"/><path d="M418 164l-94-25"/><path d="M207 210l44-48"/><path d="M353 210l-44-48"/></g><g fill="#083344" font-family="system-ui,sans-serif" font-size="12" font-weight="850" text-anchor="middle"><text x="145" y="80">WHO</text><text x="415" y="80">WHAT</text><text x="118" y="175">WHERE</text><text x="442" y="175">WHEN</text><text x="190" y="230">WHY</text><text x="370" y="230">HOW</text></g><text x="280" y="279" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="27" font-weight="850">Questions Shape Explanations</text><text x="280" y="302" text-anchor="middle" fill="#cffafe" font-family="system-ui,sans-serif" font-size="14">Ask · Answer · Support · Synthesize</text></svg>';
          rootPort.data.altText = 'A central question connected to Who, What, Where, When, Why, and How lenses.';
          rootPort.data.view = { intent: 'node', payload: 'node.web.summary', label: title };
          rootPort.data.payload = 'node.web.summary';
          rootPort.data.intent = 'node';
          rootPort.data.key = 'node.web.summary';
          rootPort.data.viewRole = 'summary';
          rootPort.data.viewKind = 'display';
          rootPort.data.semanticLevel = 'summary';
          rootPort.data.visibilityRole = 'browser';
          rootPort.data.description = 'A reusable explanation grammar centered on one topic, repeatable question lenses, explicit answers, and a synthesized summary.';

          instructions.label = 'Reading This Idea';
          instructions.data.identity.graphId = graphId;
          instructions.data.title = 'Reading This Idea';
          instructions.data.markdown = '# Reading This Idea\n\nThe graph argues for a reusable explanation template rather than implementing the template itself. Follow the semantic edges from the problem with undifferentiated documents toward a small question-and-answer grammar.\n\nThe central design choice is deliberate: **Who, What, Where, When, Why, and How are seeded instances of one `qa-question` class with a `lens` field**, not six separate node classes.';

          idea.data.title = 'Questions Should Organize Explanations';
          idea.data.statement = 'A reusable graph template should explain any subject through a central topic, repeatable question nodes carrying lenses such as who, what, where, when, why, and how, answer nodes, supporting context, and a synthesized summary.';
          idea.data.status = 'framed';
          idea.data.confidence = 'plausible';
          idea.data.notes = 'The template should behave as an explanation machine: Topic is examined by Questions; Questions are answered by Answers; Answers are supported, illustrated, qualified, and synthesized.';

          problem.data.title = 'Explanations Collapse Into Undifferentiated Documents';
          problem.data.statement = 'General explanations often become long markdown blocks or linear articles that hide which question each passage answers, how claims relate, and where sources, examples, or caveats belong.';
          problem.data.impact = 'Readers, authors, and agents cannot quickly navigate the explanation, identify missing coverage, inspect support, or reuse its structure across subjects.';
          problem.data.urgency = 'medium';

          audience.data.title = 'People and Agents Explaining a Subject';
          audience.data.description = 'Learners, teachers, technical writers, product authors, researchers, and agents building understandable graph-based explanations.';
          audience.data.needs = 'A reusable structure that makes coverage, support, uncertainty, examples, and follow-up questions visible without requiring a custom ontology for every topic.';

          approach.data.title = 'Use a Question-Driven Explanation Grammar';
          approach.data.description = 'Center the graph on a Topic and Summary. Seed six qa-question instances with who, what, where, when, why, and how lenses. Connect repeatable Answer, Source, Example, Caveat, and optional Term nodes through explicit semantic edges.';
          approach.data.differentiator = 'One reusable question class with a lens field remains extensible while the graph grammar distinguishes answers, support, illustration, qualification, dependency, follow-up, and synthesis.';

          question.data.title = 'Smallest Useful Class Set';
          question.data.question = 'Which node and edge classes are essential for a first version without turning the template into a taxonomy museum?';
          question.data.status = 'open';
          question.data.answer = 'Likely seven core node classes: qa-topic, qa-question, qa-answer, qa-source, qa-example, qa-caveat, and qa-summary, with qa-term and qa-audience optional.';

          assumption.data.title = 'The Grammar Works Across Domains';
          assumption.data.statement = 'A central topic, repeatable question lenses, answers, supporting context, and synthesis can explain history, science, software, people, products, and events without domain-specific node classes.';
          assumption.data.importance = 'critical';
          assumption.data.status = 'untested';

          research.data.title = 'Five Ws and How as Prior Art';
          research.data.findings = 'The familiar who, what, where, when, why, and how scaffold offers a broadly understood starting set, but the template should model them as seeded question instances rather than hard-coded node types.';
          research.data.sourceUrl = '';
          research.data.sourceType = 'other';

          evidence.data.title = 'A Small Grammar Already Describes the Template';
          evidence.data.observation = 'During the design discussion, the proposed roles reduced naturally to Topic, Question, Answer, Source, Example, Caveat, Summary, and a compact set of semantic relationships. The same structure appeared suitable for several unrelated subject domains.';
          evidence.data.kind = 'observation';
          evidence.data.strength = 'moderate';
          evidence.data.sourceRef = '';

          alternative.data.title = 'Separate Node Type for Every Question Word';
          alternative.data.description = 'Create distinct Who, What, Where, When, Why, and How node classes, or use generic markdown nodes with no explanatory grammar.';
          alternative.data.tradeoffs = 'Separate classes make the initial layout obvious but multiply contracts and resist custom questions. Generic markdown is flexible but loses semantic structure and inspectable relationships.';

          risk.data.title = 'The Template Could Over-Structure Simple Explanations';
          risk.data.description = 'A rigid six-question layout may force irrelevant answers, encourage shallow completeness, or make a small explanation feel bureaucratic.';
          risk.data.likelihood = 'medium';
          risk.data.impact = 'medium';
          risk.data.mitigation = 'Treat the six lenses as removable seeds, permit custom lenses, and require only questions relevant to the topic.';

          nextStep.data.title = 'Derive and Test a Minimal Q&A Template';
          nextStep.data.action = 'Build a first template with seven core node classes and the essential edge grammar, then derive three explanation graphs from unrelated domains.';
          nextStep.data.expectedEvidence = 'The three graphs remain understandable, omit irrelevant question lenses cleanly, support custom follow-ups, and produce useful summaries without adding domain-specific node classes.';
          nextStep.data.status = 'todo';

          graph.fileVersion = '1.0';
          graph.nodeCount = graph.nodes.length;
          graph.edgeCount = graph.edges.length;
          graph.timestamp = now;

          const nodeIds = new Set();
          for (const node of graph.nodes) {
            if (!node.id || nodeIds.has(node.id)) throw new Error(`Duplicate or missing node id: ${node.id}`);
            nodeIds.add(node.id);
            if (node?.data?.identity?.graphId === oldPrefix) throw new Error(`Stale graph identity on ${node.id}`);
          }
          for (const edge of graph.edges) {
            if (!nodeIds.has(edge.source)) throw new Error(`Missing edge source ${edge.source}`);
            if (!nodeIds.has(edge.target)) throw new Error(`Missing edge target ${edge.target}`);
          }
          const surface = declaration.data.declaration.surfaces.find((entry) => entry.id === 'root');
          if (!surface || surface.portNodeId !== rootPort.id || rootPort.type !== 'port') throw new Error('Declaration root surface is invalid');
          const semanticNodes = graph.nodes.filter((node) => String(node.type || '').startsWith('idea'));
          for (const node of semanticNodes) {
            if (node.data.definitionKey !== node.type) throw new Error(`definitionKey mismatch on ${node.id}`);
            if (node.data._classBinding?.key !== node.type) throw new Error(`class binding mismatch on ${node.id}`);
            if (!String(node.data._classBinding?.sourceRef || '').includes('/templates/idea-template/classes/nodes/')) throw new Error(`noncanonical class ref on ${node.id}`);
          }
          if (evidence.data.sourceRef !== '') throw new Error('Evidence sourceRef must remain empty until a real address exists');
          JSON.parse(JSON.stringify(graph));

          fs.mkdirSync(path.dirname(outputPath), { recursive: true });
          fs.writeFileSync(outputPath, JSON.stringify(graph, null, 2) + '\n');
          console.log(`Wrote ${outputPath} with ${graph.nodes.length} nodes and ${graph.edges.length} edges`);
          NODE

      - name: Commit generated graph
        run: |
          git config user.name "Twilite Graph Builder"
          git config user.email "actions@users.noreply.github.com"
          git add ideas/question-driven-explanation-template.node
          if git diff --cached --quiet; then
            echo "No graph changes to commit"
          else
            git commit -m "Add question-driven explanation template idea"
            git push origin HEAD:idea/question-driven-explanation-template
          fi
