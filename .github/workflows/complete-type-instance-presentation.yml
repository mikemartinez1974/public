name: Complete type and instance presentation task

on:
  push:
    branches:
      - complete/type-instance-presentation
    paths:
      - .github/workflows/complete-type-instance-presentation.yml

permissions:
  contents: write

jobs:
  complete-graphs:
    runs-on: ubuntu-latest
    env:
      COMPLETED_AT: 2026-08-05T00:15:00.000Z
      IMPLEMENTATION_COMMIT: https://github.com/mikemartinez1974/nodegraph-editor/commit/45ebe4d708c77c3b95a6370febe0d088da908351
      IMPLEMENTATION_PR: https://github.com/mikemartinez1974/nodegraph-editor/pull/1
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: complete/type-instance-presentation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Complete task, idea, and collection graphs
        run: |
          node scripts/complete-type-instance-presentation.mjs
          node scripts/archive-type-instance-presentation.mjs

      - name: Validate touched graph files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const paths = [
            'tasks/type-and-instance-presentation/root.node',
            'tasks/root.node',
            'tasks/archive/2026/q3.node',
            'ideas/type-and-instance-presentation.node'
          ];
          for (const path of paths) {
            const graph = JSON.parse(fs.readFileSync(path, 'utf8'));
            const ids = new Set((graph.nodes || []).map((node) => node.id));
            if (ids.size !== (graph.nodes || []).length) throw new Error(`${path}: duplicate node ids`);
            for (const edge of graph.edges || []) {
              if (!ids.has(edge.source) || !ids.has(edge.target)) {
                throw new Error(`${path}: dangling edge ${edge.id}`);
              }
            }
            if (graph.nodeCount !== graph.nodes.length || graph.edgeCount !== graph.edges.length) {
              throw new Error(`${path}: stale counts`);
            }
          }
          const task = JSON.parse(fs.readFileSync(paths[0], 'utf8'));
          const declaration = task.nodes.find((node) => node.id === 'type-instance-task-declaration');
          const rootSurface = declaration?.data?.declaration?.surfaces?.find((surface) => surface.id === 'root');
          if (!rootSurface || rootSurface.viewNodeId !== 'type-instance-task-root-port') {
            throw new Error('Task root surface is invalid');
          }
          const question = task.nodes.find((node) => node.id === 'type-instance-task-edge-question');
          if (question?.data?.status !== 'answered') throw new Error('Edge question is not answered');
          const archive = JSON.parse(fs.readFileSync(paths[2], 'utf8'));
          if (!archive.nodes.some((node) => node.id === 'task-archive-type-instance-presentation')) {
            throw new Error('Completed task portal is missing from the Q3 archive');
          }
          const idea = JSON.parse(fs.readFileSync(paths[3], 'utf8'));
          if (!idea.nodes.some((node) => node.id === 'type-and-instance-presentation-task-portal')) {
            throw new Error('Idea implementation portal is missing');
          }
          console.log('All touched Twilite graphs are valid.');
          NODE

      - name: Commit completed graph lifecycle
        run: |
          git config user.name "Twilite Graph Maintainer"
          git config user.email "actions@github.com"
          git add tasks/type-and-instance-presentation/root.node tasks/root.node tasks/archive/2026/q3.node ideas/type-and-instance-presentation.node
          git commit -m "Complete type and instance presentation task"
          git push origin HEAD:complete/type-instance-presentation
