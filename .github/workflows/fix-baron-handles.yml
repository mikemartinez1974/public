name: Fix Baron Coleman handles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-baron-handles.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add real handle metadata and normalize edge ports
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('people/baron-coleman.node')
          graph = json.loads(path.read_text())

          for node in graph.get('nodes', []):
              ps = node.get('ports') or []
              if not ps:
                  continue
              node['handles'] = [dict(p) for p in ps]
              node['inputs'] = [
                  {
                      'key': p['id'],
                      'label': p.get('label', p['id']),
                      'type': 'any' if p['id'] == 'root' else 'value'
                  }
                  for p in ps
              ]
              node['outputs'] = [dict(v) for v in node['inputs']]

          for edge in graph.get('edges', []):
              edge.pop('sourceHandle', None)
              edge.pop('targetHandle', None)

          graph.setdefault('metadata', {})['version'] = '1.3.0'
          graph['metadata']['modified'] = '2026-08-07T15:08:00-05:00'
          for node in graph.get('nodes', []):
              if node.get('id') == 'decl':
                  identity = node.setdefault('data', {}).setdefault('identity', {})
                  identity['version'] = '1.3.0'
                  identity['updatedAt'] = '2026-08-07T15:08:00-05:00'
                  break

          path.write_text(json.dumps(graph, indent=2) + '\n')
          PY
          rm .github/workflows/fix-baron-handles.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'Twilite Graph Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add people/baron-coleman.node .github/workflows/fix-baron-handles.yml
          git commit -m 'Use real handles in Baron Coleman graph'
          git push
