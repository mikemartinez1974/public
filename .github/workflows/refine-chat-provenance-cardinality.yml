name: Refine Chat provenance cardinality

on:
  push:
    branches:
      - task/refine-chat-provenance-cardinality

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/refine-chat-provenance-cardinality

      - name: Record one-conversation-per-node decision
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const graphPath = 'tasks/chat-node-provenance/root.node';
          const graph = JSON.parse(fs.readFileSync(graphPath, 'utf8'));
          const now = '2026-08-05T22:57:00.000Z';
          const graphId = 'create-chat-provenance-node-declaration';
          const clone = (value) => JSON.parse(JSON.stringify(value));
          const byId = new Map((graph.nodes || []).map((node) => [node.id, node]));
          const byLabel = (label) => (graph.nodes || []).find((node) => node.label === label);
          const byType = (type) => (graph.nodes || []).find((node) => node.type === type);

          const declaration = byType('declaration');
          const goal = byType('goal');
          const existingDecision = byType('decision');
          const question = byId.get('create-chat-provenance-node-question-conversation-scope')
            || byLabel('Does one Chat node represent one conversation or a conversation chain?');
          const contractTask = byLabel('Define the Minimal Chat Node Data Contract');
          const relationshipsTask = byLabel('Define Chat-to-Artifact Provenance Relationships');
          const prototypeTask = byLabel('Build a Non-Public Prototype Graph');
          const finalTask = byLabel('Finalize the v0.1 Contract and Integration Boundary');
          const summary = byType('summary');
          const summaryTask = (graph.nodes || []).find((node) => node.type === 'task' && node?.data?.countAsTask === false);

          for (const [name, node] of Object.entries({ declaration, goal, existingDecision, question, contractTask, relationshipsTask, prototypeTask, finalTask, summary, summaryTask })) {
            if (!node) throw new Error(`Missing required node: ${name}`);
          }

          graph.metadata.modified = now;
          declaration.data.identity.updatedAt = now;
          declaration.data.cardinality = {
            chatNodeToConversation: 'one-to-one',
            graphToChatNodes: 'one-to-many'
          };
          declaration.data.notes = Array.from(new Set([
            ...(declaration.data.notes || []),
            'Each Chat node represents exactly one conversation. A graph may accumulate many Chat nodes across creation, revision, review, and explanation events.'
          ]));

          goal.data.successMetrics = Array.from(new Set([
            ...(goal.data.successMetrics || []),
            'A graph can contain multiple Chat nodes, each independently representing one conversation and one provenance event.',
            'Each Chat node can optionally anchor its contribution to a specific graph revision, commit, node set, or captured state.'
          ]));

          contractTask.data.body = 'Specify the fields for one conversation source, source kind, provider, conversation reference or URL, access mode, snapshot scope, captured summary, optional excerpt, timestamps, status, and provenance event metadata. A graph may contain many Chat nodes, but each Chat node represents exactly one conversation.';
          contractTask.data.acceptanceCriteria = Array.from(new Set([
            ...(contractTask.data.acceptanceCriteria || []),
            'The base contract permits exactly one conversation reference per Chat node rather than an array of conversations.',
            'Multiple revisions are represented by multiple Chat nodes attached to the graph.'
          ]));

          relationshipsTask.data.body = 'Define how each Chat node records that its single conversation created, revised, explained, reviewed, or otherwise contributed to a graph or node. Support many Chat nodes across an artifact lifetime, with optional anchors to a graph revision, commit, captured state, or affected node set.';
          relationshipsTask.data.acceptanceCriteria = Array.from(new Set([
            ...(relationshipsTask.data.acceptanceCriteria || []),
            'Each provenance relationship may identify the artifact state or revision affected by that conversation.',
            'Several Chat nodes can independently contribute to the same graph without being merged into one conversation record.',
            'Chronology can be reconstructed from event timestamps and optional explicit sequence relationships.'
          ]));

          prototypeTask.data.body = 'Create a private test graph containing several Chat nodes across the same artifact lifecycle: an originating conversation, at least one revision conversation, and an explanatory or review conversation. Include owner-only, shared-snapshot, and locally preserved source modes.';
          prototypeTask.data.acceptanceCriteria = Array.from(new Set([
            ...(prototypeTask.data.acceptanceCriteria || []),
            'At least three distinct Chat nodes point to three distinct conversations associated with one evolving graph.',
            'The graph visibly distinguishes creation, revision, and explanation or review provenance events.',
            'At least one Chat node is anchored to a specific graph revision or captured state.'
          ]));

          finalTask.data.acceptanceCriteria = Array.from(new Set([
            ...(finalTask.data.acceptanceCriteria || []),
            'The final contract states one Chat node per conversation and supports many Chat nodes per graph.',
            'The final contract defines the optional revision-anchor fields used to say what artifact state a conversation affected.'
          ]));

          question.data.status = 'answered';
          question.data.answeredAt = now;
          question.data.answer = 'One Chat node represents exactly one conversation. A graph may contain many Chat nodes as it is created, revised, reviewed, or explained.';
          question.data.resolution = 'Use graph-level multiplicity instead of embedding several conversation references inside one Chat node. Preserve each conversation as its own durable provenance record.';
          question.data.resolutionPath = 'Resolved by product decision during task review.';

          const decisionId = 'create-chat-provenance-node-decision-one-conversation-per-node';
          let cardinalityDecision = byId.get(decisionId);
          if (!cardinalityDecision) {
            cardinalityDecision = clone(existingDecision);
            cardinalityDecision.id = decisionId;
            cardinalityDecision.label = 'Use One Chat Node per Conversation';
            cardinalityDecision.position = { x: 1540, y: 1250 };
            cardinalityDecision.data = {
              ...(cardinalityDecision.data || {}),
              title: 'Use One Chat Node per Conversation',
              status: 'decided',
              decidedAt: now,
              owner: 'Michael',
              supersededBy: '',
              body: 'A Chat node is a durable provenance record for exactly one conversation. A graph may accumulate any number of Chat nodes as it is created, revised, reviewed, or explained. Each node retains its own source, access state, captured context, timestamp, provenance role, and optional artifact-revision anchor. Conversation history is represented by multiple nodes and graph relationships, not by an array of unrelated conversations inside one node.',
              identity: { ...((cardinalityDecision.data || {}).identity || {}), graphId }
            };
            graph.nodes.push(cardinalityDecision);
            byId.set(decisionId, cardinalityDecision);
          }

          const addEdge = (edge) => {
            if (!(graph.edges || []).some((existing) => existing.id === edge.id)) graph.edges.push(edge);
          };
          addEdge({
            id: 'create-chat-provenance-node-edge-conversation-scope-resolved-by-cardinality-decision',
            type: 'reference',
            source: question.id,
            target: cardinalityDecision.id,
            sourcePort: 'right',
            targetPort: 'left',
            label: 'resolved by',
            style: {},
            data: {}
          });
          addEdge({
            id: 'create-chat-provenance-node-edge-cardinality-constrains-contract',
            type: 'reference',
            source: cardinalityDecision.id,
            target: contractTask.id,
            sourcePort: 'left',
            targetPort: 'right',
            label: 'constrains',
            style: {},
            data: {}
          });

          summary.data.questionProgress = {
            answered: (graph.nodes || []).filter((node) => node.type === 'open-question' && ['answered', 'resolved', 'closed'].includes(String(node?.data?.status || '').toLowerCase())).length,
            total: (graph.nodes || []).filter((node) => node.type === 'open-question').length
          };
          summary.data.updatedAt = now;
          summaryTask.data.body = String(summaryTask.data.body || '')
            .replace('3. Does one Chat node represent one conversation or a conversation chain?', '3. Does one Chat node represent one conversation or a conversation chain? [answered: one conversation per node; many nodes per graph]');

          graph.timestamp = now;
          graph.nodeCount = graph.nodes.length;
          graph.edgeCount = graph.edges.length;

          const handleIds = (node) => new Set([
            ...((node.ports || []).map((entry) => entry.id)),
            ...((node.handles || []).map((entry) => entry.id)),
            ...((node.inputs || []).map((entry) => entry.key)),
            ...((node.outputs || []).map((entry) => entry.key))
          ].filter(Boolean));
          const ids = new Set();
          for (const node of graph.nodes || []) {
            if (!node.id || ids.has(node.id)) throw new Error(`Duplicate or missing node id: ${node.id}`);
            ids.add(node.id);
          }
          const edgeIds = new Set();
          for (const edge of graph.edges || []) {
            if (!edge.id || edgeIds.has(edge.id)) throw new Error(`Duplicate or missing edge id: ${edge.id}`);
            edgeIds.add(edge.id);
            const source = byId.get(edge.source) || (graph.nodes || []).find((node) => node.id === edge.source);
            const target = byId.get(edge.target) || (graph.nodes || []).find((node) => node.id === edge.target);
            if (!source || !target) throw new Error(`Unresolved edge endpoint: ${edge.id}`);
            if (edge.sourcePort && !handleIds(source).has(edge.sourcePort)) throw new Error(`Invalid source port ${edge.sourcePort} on ${edge.id}`);
            if (edge.targetPort && !handleIds(target).has(edge.targetPort)) throw new Error(`Invalid target port ${edge.targetPort} on ${edge.id}`);
          }
          if (question.data.status !== 'answered') throw new Error('Conversation-scope question was not resolved');
          if ((graph.nodes || []).filter((node) => node.id === decisionId).length !== 1) throw new Error('Cardinality decision count mismatch');
          if (declaration.data.cardinality.chatNodeToConversation !== 'one-to-one') throw new Error('Missing one-to-one Chat node cardinality');
          if (declaration.data.cardinality.graphToChatNodes !== 'one-to-many') throw new Error('Missing one-to-many graph cardinality');
          JSON.parse(JSON.stringify(graph));

          fs.writeFileSync(graphPath, JSON.stringify(graph, null, 2) + '\n');
          console.log(`Updated ${graphPath} with one-conversation-per-node cardinality decision`);
          NODE

      - name: Commit refined task graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Twilite Graph Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refine-chat-provenance-cardinality.yml
          git add tasks/chat-node-provenance/root.node
          git commit -m "Clarify Chat provenance node cardinality"
          git push origin HEAD:task/refine-chat-provenance-cardinality
