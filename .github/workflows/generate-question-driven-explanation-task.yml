name: Generate question-driven explanation task graph

on:
  push:
    branches:
      - task/question-driven-explanation-template-prototype

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/question-driven-explanation-template-prototype

      - name: Build task graph and register collection portal
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/twilite-zone/public/main/library/classes/nodes/task-planning/task-graph-template.node" -o /tmp/task-graph-template.node
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const templatePath = '/tmp/task-graph-template.node';
          const collectionPath = 'tasks/root.node';
          const outputPath = 'tasks/question-driven-explanation-template/root.node';
          const oldPrefix = 'task-graph-template';
          const slug = 'question-driven-explanation-template-prototype';
          const graphId = `${slug}-declaration`;
          const title = 'Prototype the Question-Driven Explanation Template';
          const description = 'Build the minimal Q&A explanation template, derive three unrelated specimen graphs, and evaluate whether the grammar remains useful across domains.';
          const now = '2026-08-05T22:23:00.000Z';
          const graphRef = `github://mikemartinez1974/public/${outputPath}`;
          const originGraphRef = 'github://mikemartinez1974/public/ideas/question-driven-explanation-template.node';
          const originNodeId = 'question-driven-explanation-template-idea-next-step';

          const graph = JSON.parse(fs.readFileSync(templatePath, 'utf8'));
          const collection = JSON.parse(fs.readFileSync(collectionPath, 'utf8'));
          const clone = (value) => JSON.parse(JSON.stringify(value));

          const idMap = new Map();
          for (const node of graph.nodes || []) {
            if (typeof node.id === 'string' && node.id.startsWith(oldPrefix)) {
              idMap.set(node.id, slug + node.id.slice(oldPrefix.length));
            }
          }

          const replaceExactIds = (value) => {
            if (typeof value === 'string') return idMap.get(value) || value;
            if (Array.isArray(value)) return value.map(replaceExactIds);
            if (value && typeof value === 'object') {
              const next = {};
              for (const [key, child] of Object.entries(value)) next[key] = replaceExactIds(child);
              return next;
            }
            return value;
          };

          graph.nodes = (graph.nodes || []).map(replaceExactIds);
          graph.edges = (graph.edges || []).map(replaceExactIds);
          for (const edge of graph.edges) {
            if (typeof edge.id === 'string' && edge.id.startsWith(oldPrefix)) {
              edge.id = slug + edge.id.slice(oldPrefix.length);
            }
          }

          const replacePrefixInStrings = (value) => {
            if (typeof value === 'string') return value.split(oldPrefix).join(slug);
            if (Array.isArray(value)) return value.map(replacePrefixInStrings);
            if (value && typeof value === 'object') {
              const next = {};
              for (const [key, child] of Object.entries(value)) next[key] = replacePrefixInStrings(child);
              return next;
            }
            return value;
          };
          for (const node of graph.nodes) {
            if (node.type === 'script') node.data = replacePrefixInStrings(node.data || {});
          }

          graph.fileVersion = '1.0';
          graph.metadata = {
            title,
            description,
            graphId,
            version: '0.1.0',
            kind: 'task',
            created: now,
            modified: now,
            author: 'Michael Martinez',
            tags: [
              'task',
              'q-and-a',
              'explanation-template',
              'prototype',
              'cross-domain-test'
            ],
            preferredViewer: 'https://twilite.zone'
          };

          const byType = (type) => graph.nodes.find((node) => node.type === type);
          const declaration = byType('declaration');
          const titleNode = byType('title');
          const typeNode = byType('type-definition');
          const portView = byType('port-view');
          const iconView = byType('icon-view');
          const goal = byType('goal');
          const baseTask = graph.nodes.find((node) => node.type === 'task' && node?.data?.countAsTask !== false);
          const baseQuestion = byType('open-question');
          const decision = byType('decision');
          const summary = byType('summary');
          const summaryTask = graph.nodes.find((node) => node.type === 'task' && node?.data?.countAsTask === false);

          for (const [name, node] of Object.entries({ declaration, titleNode, typeNode, portView, iconView, goal, baseTask, baseQuestion, decision, summary, summaryTask })) {
            if (!node) throw new Error(`Canonical task template is missing ${name}`);
          }

          declaration.label = `${title} Declaration`;
          declaration.data.identity = {
            graphId,
            name: title,
            version: '0.1.0',
            description,
            createdAt: now,
            updatedAt: now
          };
          declaration.data.intent = { kind: 'task', scope: 'local' };
          declaration.data.name = `${title} Declaration`;
          declaration.data.purpose = description;
          declaration.data.summaryNodeId = summary.id;
          declaration.data.origin = {
            relation: 'implements-next-step',
            graphRef: originGraphRef,
            nodeId: originNodeId
          };
          declaration.data.declaration = declaration.data.declaration || {};
          declaration.data.declaration.kind = 'task';
          declaration.data.declaration.targetMode = 'artifact';
          declaration.data.declaration.artifactKind = 'task-graph';
          declaration.data.declaration.defaultSurfaceId = 'card';
          declaration.data.declaration.primaryNodeViewId = summary.id;
          declaration.data.declaration.iconViewNodeId = iconView.id;
          declaration.data.declaration.portViewNodeId = portView.id;
          for (const surface of declaration.data.declaration.surfaces || []) {
            if (surface.id === 'card') {
              surface.label = title;
              surface.viewNodeId = portView.id;
              surface.memo = 'Primary outward-facing card for the Q&A explanation template prototype task.';
            } else if (surface.id === 'summary') {
              surface.viewNodeId = summary.id;
            } else if (surface.id === 'workspace') {
              surface.viewNodeId = summaryTask.id;
            } else if (surface.id === 'icon') {
              surface.viewNodeId = iconView.id;
            }
          }

          titleNode.label = title;
          titleNode.data.title = title;
          titleNode.data.subtitle = 'Build the grammar, test three domains, then decide whether the template earns promotion.';
          if (titleNode.data.identity) titleNode.data.identity.graphId = graphId;

          typeNode.label = 'Task Graph';
          typeNode.data.name = 'Question-Driven Explanation Prototype Task';
          typeNode.data.key = 'question-driven-explanation-template-prototype';
          typeNode.data.meaning = 'A promoted planning graph for implementing and testing the proposed Q&A explanation template.';
          typeNode.data.description = description;
          typeNode.data.category = 'planning';
          typeNode.data.status = 'active';
          if (typeNode.data.identity) typeNode.data.identity.graphId = graphId;

          const cardSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="Question-driven explanation template prototype task"><defs><linearGradient id="qa-task-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.58" stop-color="#164e63"/><stop offset="1" stop-color="#3730a3"/></linearGradient></defs><rect x="5" y="5" width="510" height="310" rx="30" fill="url(#qa-task-bg)" stroke="#a5f3fc" stroke-width="3"/><circle cx="260" cy="88" r="38" fill="#111827" stroke="#e0f2fe" stroke-width="4"/><text x="260" y="102" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="40" font-weight="850">?</text><g font-family="system-ui,sans-serif" font-size="13" font-weight="800" text-anchor="middle"><rect x="56" y="153" width="118" height="76" rx="16" fill="#0f766e" stroke="#99f6e4" stroke-width="2"/><text x="115" y="184" fill="#f0fdfa">SCIENCE</text><text x="115" y="207" fill="#ccfbf1">specimen</text><rect x="201" y="153" width="118" height="76" rx="16" fill="#1d4ed8" stroke="#bfdbfe" stroke-width="2"/><text x="260" y="184" fill="#eff6ff">HISTORY</text><text x="260" y="207" fill="#dbeafe">specimen</text><rect x="346" y="153" width="118" height="76" rx="16" fill="#6d28d9" stroke="#ddd6fe" stroke-width="2"/><text x="405" y="184" fill="#faf5ff">SOFTWARE</text><text x="405" y="207" fill="#ede9fe">specimen</text></g><path d="M260 126v18M174 191h27M319 191h27" fill="none" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round"/><text x="260" y="270" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="23" font-weight="850">BUILD · DERIVE · EVALUATE</text><text x="260" y="294" text-anchor="middle" fill="#cffafe" font-family="system-ui,sans-serif" font-size="14">Seven core classes, one reusable grammar</text></svg>';
          portView.label = title;
          portView.data.title = title;
          portView.data.purpose = 'Prototype the seven-class explanation grammar and test it against science, history, and software subjects.';
          portView.data.titleSourceNodeId = titleNode.id;
          portView.data.typeSourceNodeId = typeNode.id;
          portView.data.status = 'active';
          portView.data.svg = cardSvg;
          if (portView.data.identity) portView.data.identity.graphId = graphId;

          iconView.label = 'Q&A Template Prototype';
          iconView.data.title = 'Q&A Template Prototype';
          iconView.data.purpose = 'Question-driven explanation template implementation and test task.';
          iconView.data.titleSourceNodeId = titleNode.id;
          iconView.data.typeSourceNodeId = typeNode.id;
          iconView.data.status = 'active';
          iconView.data.svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Q and A template prototype"><rect x="12" y="12" width="96" height="96" rx="24" fill="#0f172a" stroke="#67e8f9" stroke-width="6"/><circle cx="60" cy="48" r="23" fill="#164e63" stroke="#cffafe" stroke-width="4"/><text x="60" y="58" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="31" font-weight="850">?</text><path d="M31 87h58" stroke="#a5f3fc" stroke-width="7" stroke-linecap="round"/></svg>';
          if (iconView.data.identity) iconView.data.identity.graphId = graphId;

          goal.label = 'Validate a Minimal Question-Driven Explanation Template';
          goal.position = { x: -260, y: 180 };
          goal.data.body = 'Build a first Q&A explanation template with seven core node classes and the essential edge grammar, derive three explanation graphs from unrelated domains, and evaluate whether the structure remains clear without domain-specific node classes.';
          goal.data.priority = 'high';
          goal.data.status = 'todo';
          goal.data.owner = 'Michael';
          goal.data.targetDate = '';
          goal.data.successMetrics = [
            'A canonical template graph exists with qa-topic, qa-question, qa-answer, qa-source, qa-example, qa-caveat, and qa-summary classes.',
            'Science, history, and software specimens are derived from the same template.',
            'Irrelevant seeded lenses can be removed cleanly and custom follow-up questions can be added without new node classes.',
            'A written evaluation records whether qa-term and qa-audience belong in v0.1.'
          ];
          goal.data.identity = { ...(goal.data.identity || {}), graphId };

          const taskSpecs = [
            {
              id: baseTask.id,
              label: 'Define the v0.1 Node and Edge Contract',
              body: 'Specify the seven core node classes, the qa-question lens vocabulary, and the essential asking, answering, supporting, illustrating, qualifying, following-up, dependency, and synthesis relationships.',
              estimateHours: '2',
              acceptanceCriteria: [
                'Each core class has a concise purpose and minimum fields.',
                'Who, What, Where, When, Why, and How are seeded qa-question instances rather than separate classes.',
                'The essential edge grammar distinguishes structure from optional enrichment.'
              ],
              position: { x: -980, y: 620 }
            },
            {
              id: `${slug}-task-build-template`,
              label: 'Build the Canonical Q&A Explanation Template',
              body: 'Create the reusable declaration-first template with a central topic, six removable question lenses, answer and support placeholders, summary surfaces, class bridges, and an outward-facing port card.',
              estimateHours: '4',
              acceptanceCriteria: [
                'The graph parses and every edge endpoint and handle resolves.',
                'The declaration exposes valid card, summary, workspace, and icon surfaces.',
                'The template can be copied without retaining stale graph identity.'
              ],
              position: { x: -480, y: 620 }
            },
            {
              id: `${slug}-task-science-specimen`,
              label: 'Derive a Science Specimen: Plate Tectonics',
              body: 'Use the template to explain plate tectonics and record where the grammar helps, where lenses are irrelevant, and which support nodes become necessary.',
              estimateHours: '2',
              acceptanceCriteria: [
                'The specimen uses the shared Q&A classes without science-specific node types.',
                'At least one irrelevant seeded lens is removed or reframed deliberately.',
                'The summary is understandable without opening every node.'
              ],
              position: { x: 20, y: 620 }
            },
            {
              id: `${slug}-task-history-specimen`,
              label: 'Derive a History Specimen: The Printing Press',
              body: 'Use the same template to explain the invention and spread of the printing press, emphasizing people, place, chronology, causes, and consequences.',
              estimateHours: '2',
              acceptanceCriteria: [
                'The specimen uses the same core classes and edge grammar as the science graph.',
                'Chronology and multiple actors fit without new domain-specific classes.',
                'Sources and caveats attach to individual answers rather than one undifferentiated bibliography.'
              ],
              position: { x: -980, y: 1020 }
            },
            {
              id: `${slug}-task-software-specimen`,
              label: 'Derive a Software Specimen: HTTP Request Lifecycle',
              body: 'Use the template to explain how an HTTP request travels from a client through the network and server to a response.',
              estimateHours: '2',
              acceptanceCriteria: [
                'The process explanation fits the shared grammar without software-specific node types.',
                'How and What questions can depend on earlier answers visibly.',
                'A custom follow-up question can be added without altering the template contract.'
              ],
              position: { x: -480, y: 1020 }
            },
            {
              id: `${slug}-task-evaluate`,
              label: 'Evaluate the Three Specimens and Decide v0.1 Scope',
              body: 'Compare the three graphs for clarity, missing coverage, unnecessary structure, summary quality, and pressure to add domain-specific classes. Record the v0.1 keep, defer, and revise decisions.',
              estimateHours: '3',
              acceptanceCriteria: [
                'The evaluation compares all three domains against the same criteria.',
                'The decision on qa-term and qa-audience is recorded.',
                'Any edge classes that proved ornamental rather than useful are removed or deferred.',
                'The task graph ends with a clear promote, revise, or abandon recommendation.'
              ],
              position: { x: 20, y: 1020 }
            }
          ];

          const taskNodes = [];
          for (let index = 0; index < taskSpecs.length; index += 1) {
            const spec = taskSpecs[index];
            const node = index === 0 ? baseTask : clone(baseTask);
            node.id = spec.id;
            node.label = spec.label;
            node.position = spec.position;
            node.data = {
              ...(node.data || {}),
              title: spec.label,
              body: spec.body,
              priority: index < 2 || index === taskSpecs.length - 1 ? 'high' : 'medium',
              status: 'todo',
              owner: 'Michael',
              estimateHours: spec.estimateHours,
              acceptanceCriteria: spec.acceptanceCriteria,
              identity: { ...((node.data || {}).identity || {}), graphId }
            };
            if (index > 0) graph.nodes.push(node);
            taskNodes.push(node);
          }

          const questionSpecs = [
            {
              id: baseQuestion.id,
              label: 'Which edge relationships are essential in v0.1?',
              body: 'The proposed grammar includes asking, answering, supporting, contradicting, illustrating, qualifying, defining, depending on, following up, summarizing, and contributing. Which subset earns a place in the first template?',
              position: { x: 560, y: 650 }
            },
            {
              id: `${slug}-question-optional-classes`,
              label: 'Should qa-term and qa-audience ship in v0.1?',
              body: 'The idea treats qa-term and qa-audience as optional. The three specimen graphs should reveal whether either class is common enough to belong in the first release.',
              position: { x: 560, y: 1000 }
            }
          ];
          const questionNodes = [];
          for (let index = 0; index < questionSpecs.length; index += 1) {
            const spec = questionSpecs[index];
            const node = index === 0 ? baseQuestion : clone(baseQuestion);
            node.id = spec.id;
            node.label = spec.label;
            node.position = spec.position;
            node.data = {
              ...(node.data || {}),
              body: spec.body,
              status: 'open',
              owner: '',
              resolutionPath: 'Resolve during the cross-domain evaluation task.',
              prominence: 'high',
              identity: { ...((node.data || {}).identity || {}), graphId }
            };
            if (index > 0) graph.nodes.push(node);
            questionNodes.push(node);
          }

          decision.label = 'Use One qa-question Class with a Lens Field';
          decision.position = { x: 560, y: 250 };
          decision.data.title = decision.label;
          decision.data.status = 'decided';
          decision.data.decidedAt = now;
          decision.data.owner = 'Michael';
          decision.data.supersededBy = '';
          decision.data.body = 'Who, What, Where, When, Why, and How will be seeded instances of one reusable qa-question class. Custom lenses and follow-up questions must not require new node classes.';
          decision.data.identity = { ...(decision.data.identity || {}), graphId };

          const taskTitles = taskNodes.map((node) => node.label);
          const questionTitles = questionNodes.map((node) => node.label);
          const numbered = (items) => items.map((item, index) => `${index + 1}. ${item}`).join('\n');
          summary.label = title;
          summary.data = {
            ...(summary.data || {}),
            goal: goal.label,
            status: 'todo',
            viewRole: 'document',
            taskProgress: { completed: 0, total: taskNodes.length },
            questionProgress: { answered: 0, total: questionNodes.length },
            summarySource: 'node-updater',
            nodeViewPayload: 'node.web',
            taskTitles,
            questionTitles,
            taskListText: numbered(taskTitles),
            questionListText: numbered(questionTitles),
            priority: 'high',
            owner: 'Michael',
            targetDate: '',
            nextAction: taskTitles[0],
            blockedReason: '',
            health: 'unknown',
            identity: { ...((summary.data || {}).identity || {}), graphId }
          };

          summaryTask.label = title;
          summaryTask.data = {
            ...(summaryTask.data || {}),
            title,
            body: `Goal: ${goal.label}\nStatus: todo\n\nTasks in scope:\n${numbered(taskTitles)}\n\nOpen questions:\n${numbered(questionTitles)}`,
            priority: 'high',
            status: 'todo',
            owner: 'Michael',
            estimateHours: '',
            acceptanceCriteria: [
              'Scan the task list for scope and progress',
              'Review the open questions before promoting the template'
            ],
            countAsTask: false,
            compatibilityRole: 'legacy-task-summary-consumer',
            deprecated: true,
            summarySource: 'node-updater',
            identity: { ...((summaryTask.data || {}).identity || {}), graphId }
          };

          const goalTaskEdge = graph.edges.find((edge) => edge.source === goal.id && edge.target === baseTask.id);
          const goalQuestionEdge = graph.edges.find((edge) => edge.source === goal.id && edge.target === baseQuestion.id);
          if (!goalTaskEdge || !goalQuestionEdge) throw new Error('Canonical template is missing goal-to-task or goal-to-question edges');
          for (let index = 1; index < taskNodes.length; index += 1) {
            const edge = clone(goalTaskEdge);
            edge.id = `${slug}-edge-goal-task-${index + 1}`;
            edge.target = taskNodes[index].id;
            edge.label = 'task';
            graph.edges.push(edge);
          }
          for (let index = 1; index < questionNodes.length; index += 1) {
            const edge = clone(goalQuestionEdge);
            edge.id = `${slug}-edge-goal-question-${index + 1}`;
            edge.target = questionNodes[index].id;
            edge.label = 'question';
            graph.edges.push(edge);
          }

          const addReferenceEdge = (id, source, target, label) => {
            graph.edges.push({
              id,
              type: 'reference',
              source: source.id,
              target: target.id,
              sourcePort: 'right',
              targetPort: 'left',
              label,
              style: {},
              data: {}
            });
          };
          addReferenceEdge(`${slug}-edge-contract-enables-template`, taskNodes[0], taskNodes[1], 'enables');
          addReferenceEdge(`${slug}-edge-template-enables-science`, taskNodes[1], taskNodes[2], 'enables');
          addReferenceEdge(`${slug}-edge-template-enables-history`, taskNodes[1], taskNodes[3], 'enables');
          addReferenceEdge(`${slug}-edge-template-enables-software`, taskNodes[1], taskNodes[4], 'enables');
          addReferenceEdge(`${slug}-edge-science-informs-evaluation`, taskNodes[2], taskNodes[5], 'informs');
          addReferenceEdge(`${slug}-edge-history-informs-evaluation`, taskNodes[3], taskNodes[5], 'informs');
          addReferenceEdge(`${slug}-edge-software-informs-evaluation`, taskNodes[4], taskNodes[5], 'informs');

          const sourceSurface = (declaration.data.declaration.surfaces || []).find((surface) => surface.id === 'card');
          if (!sourceSurface || sourceSurface.viewNodeId !== portView.id) throw new Error('Derived card surface does not resolve to the port view');

          const existingPortal = (collection.nodes || []).find((node) => node?.data?.sourceRef === graphRef);
          if (existingPortal) throw new Error(`Collection already contains ${graphRef}`);
          const samplePortal = (collection.nodes || []).find((node) => node.type === 'portal' && String(node?.data?.sourceRef || '').includes('/tasks/type-and-instance-presentation/root.node'))
            || (collection.nodes || []).find((node) => node.type === 'portal' && String(node?.data?.sourceRef || '').includes('/tasks/'));
          if (!samplePortal) throw new Error('No promoted task portal specimen exists in tasks/root.node');

          const portal = clone(samplePortal);
          portal.id = `task-collection-${slug}-portal`;
          portal.label = title;
          const portalYs = (collection.nodes || []).filter((node) => node.type === 'portal' && Number.isFinite(node?.position?.y)).map((node) => node.position.y);
          const maxPortalY = portalYs.length ? Math.max(...portalYs) : 600;
          portal.position = { x: samplePortal?.position?.x ?? 700, y: maxPortalY + 360 };
          portal.visible = true;
          portal.showLabel = false;
          portal.data = {
            ...(portal.data || {}),
            memo: 'Active projection of the task graph that implements and tests the Question-Driven Explanation Template idea.',
            authority: 'navigate',
            intent: 'external',
            src: graphRef,
            ref: graphRef,
            sourceRef: graphRef,
            sourceNodeId: portView.id,
            sourcePayload: 'node.web.summary',
            endpoint: `${graphRef}:card`,
            surfaceId: 'card',
            visibilityRole: 'browser',
            target: {
              ...((portal.data || {}).target || {}),
              endpoint: `${graphRef}:card`,
              ref: graphRef,
              mode: 'navigate',
              portId: 'root',
              surfaceId: 'card',
              handleId: 'root',
              label: `Open ${title}`
            }
          };
          collection.nodes.push(portal);

          const samplePortalEdges = (collection.edges || []).filter((edge) => edge.source === samplePortal.id || edge.target === samplePortal.id);
          for (let index = 0; index < samplePortalEdges.length; index += 1) {
            const edge = clone(samplePortalEdges[index]);
            edge.id = `${portal.id}-edge-${index + 1}`;
            if (edge.source === samplePortal.id) edge.source = portal.id;
            if (edge.target === samplePortal.id) edge.target = portal.id;
            collection.edges.push(edge);
          }

          collection.metadata = collection.metadata || {};
          collection.metadata.modified = now;
          collection.timestamp = now;
          collection.nodeCount = collection.nodes.length;
          collection.edgeCount = collection.edges.length;

          graph.timestamp = now;
          graph.nodeCount = graph.nodes.length;
          graph.edgeCount = graph.edges.length;

          const handleIds = (node) => new Set([
            ...((node.ports || []).map((entry) => entry.id)),
            ...((node.handles || []).map((entry) => entry.id)),
            ...((node.inputs || []).map((entry) => entry.key)),
            ...((node.outputs || []).map((entry) => entry.key))
          ].filter(Boolean));
          const validateGraph = (candidate, label) => {
            const ids = new Set();
            for (const node of candidate.nodes || []) {
              if (!node.id || ids.has(node.id)) throw new Error(`${label}: duplicate or missing node id ${node.id}`);
              ids.add(node.id);
            }
            const edgeIds = new Set();
            for (const edge of candidate.edges || []) {
              if (!edge.id || edgeIds.has(edge.id)) throw new Error(`${label}: duplicate or missing edge id ${edge.id}`);
              edgeIds.add(edge.id);
              if (!ids.has(edge.source) || !ids.has(edge.target)) throw new Error(`${label}: unresolved edge ${edge.id}`);
              const source = candidate.nodes.find((node) => node.id === edge.source);
              const target = candidate.nodes.find((node) => node.id === edge.target);
              if (edge.sourcePort && !handleIds(source).has(edge.sourcePort)) throw new Error(`${label}: invalid source port ${edge.sourcePort} on ${edge.id}`);
              if (edge.targetPort && !handleIds(target).has(edge.targetPort)) throw new Error(`${label}: invalid target port ${edge.targetPort} on ${edge.id}`);
            }
            const decl = (candidate.nodes || []).find((node) => node.type === 'declaration');
            if (!decl) throw new Error(`${label}: declaration missing`);
            for (const surface of decl?.data?.declaration?.surfaces || []) {
              const nodeId = surface.viewNodeId || surface.portNodeId || surface.nodeId;
              if (nodeId && !ids.has(nodeId)) throw new Error(`${label}: surface ${surface.id} targets missing node ${nodeId}`);
            }
            JSON.parse(JSON.stringify(candidate));
          };

          validateGraph(graph, 'task graph');
          validateGraph(collection, 'task collection');
          if ((graph.nodes || []).filter((node) => node.type === 'goal').length !== 1) throw new Error('Task graph must contain exactly one goal');
          if ((graph.nodes || []).filter((node) => node.type === 'task' && node?.data?.countAsTask !== false).length !== taskSpecs.length) throw new Error('Task count mismatch');
          if ((graph.nodes || []).filter((node) => node.type === 'open-question').length !== questionSpecs.length) throw new Error('Question count mismatch');
          if (portal.data.sourceNodeId !== sourceSurface.viewNodeId || portal.data.surfaceId !== sourceSurface.id) throw new Error('Collection portal does not match the source surface');
          const invalidActiveStatus = (collection.nodes || []).find((node) => node.type === 'task' && ['done', 'cancelled'].includes(String(node?.data?.status || '').toLowerCase()));
          if (invalidActiveStatus) throw new Error(`Active collection contains completed task ${invalidActiveStatus.id}`);

          fs.mkdirSync(path.dirname(outputPath), { recursive: true });
          fs.writeFileSync(outputPath, JSON.stringify(graph, null, 2) + '\n');
          fs.writeFileSync(collectionPath, JSON.stringify(collection, null, 2) + '\n');
          console.log(`Wrote ${outputPath} with ${graph.nodes.length} nodes and ${graph.edges.length} edges`);
          console.log(`Registered portal ${portal.id} in ${collectionPath}`);
          NODE

      - name: Commit generated task graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Twilite Graph Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/generate-question-driven-explanation-task.yml
          git add tasks/question-driven-explanation-template/root.node tasks/root.node
          git commit -m "Add question-driven explanation prototype task graph"
          git push origin HEAD:task/question-driven-explanation-template-prototype
