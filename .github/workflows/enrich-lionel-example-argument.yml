name: Enrich Lionel example argument

on:
  push:
    paths:
      - '.github/workflows/enrich-lionel-example-argument.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enrich example graph
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'templates/lionel/v1/example-01-associative-realignment.node';
          const g = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byId = id => g.nodes.find(n => n.id === id);
          const ports = [
            {id:'root',label:'root',direction:'bidirectional',dataType:'any',angle:210},
            {id:'top',label:'top',direction:'bidirectional',dataType:'value',angle:270},
            {id:'right',label:'right',direction:'bidirectional',dataType:'value',angle:0},
            {id:'bottom',label:'bottom',direction:'bidirectional',dataType:'value',angle:90},
            {id:'left',label:'left',direction:'bidirectional',dataType:'value',angle:180}
          ];
          const io = ports.map(p => ({key:p.id,label:p.label,type:p.dataType === 'any' ? 'any' : 'value'}));

          // Version bump.
          g.metadata.version = '0.4.0';
          g.metadata.modified = '2026-08-07T21:38:00-05:00';
          if (!g.metadata.tags.includes('argument-spine')) g.metadata.tags.push('argument-spine');
          const decl = byId('example-declaration');
          if (decl?.data?.identity) decl.data.identity.version = '0.4.0';

          // Central thesis: one attributed semantic destination rather than more inventory.
          const episode = byId('episode');
          const thesis = {
            id: 'central-thesis',
            type: 'markdown',
            label: 'Central Thesis',
            root: false,
            position: {
              x: (episode?.position?.x ?? 0) + 700,
              y: (episode?.position?.y ?? 0) + 90
            },
            width: 520,
            height: 270,
            handles: ports,
            ports,
            inputs: io,
            outputs: io,
            visible: true,
            showLabel: false,
            style: {
              background: 'linear-gradient(135deg, #fff7ed, #ffedd5)',
              border: '2px solid #f97316',
              borderRadius: 20
            },
            data: {
              identity: {graphId:'lionel-v1-example-01-associative-realignment'},
              visibilityRole: 'browser',
              renderShape: {kind:'markdown'},
              markdown: '# 🎯 Central Thesis\n\n**Attributed to Lionel in this episode:** the familiar left/right and MAGA-era alignment is fracturing around foreign policy, Israel/Gaza, institutional trust, and media credibility, while a looser issue-based coalition is forming across old political boundaries.\n\n**Argument pivots:** 2016 coalition logic → Gaza/Israel rupture → present realignment.\n\n*This node summarizes the episode’s argument; it does not independently establish the underlying political claims.*'
            }
          };
          const existingThesis = g.nodes.findIndex(n => n.id === thesis.id);
          if (existingThesis >= 0) g.nodes[existingThesis] = thesis; else g.nodes.push(thesis);

          const upsertEdge = e => {
            const i = g.edges.findIndex(x => x.id === e.id);
            if (i >= 0) g.edges[i] = {...g.edges[i], ...e}; else g.edges.push(e);
          };

          // One argument spine. High-level structures explain the thesis.
          upsertEdge({id:'episode-thesis',type:'reference',source:'episode',target:'central-thesis',sourcePort:'right',targetPort:'top',label:'advances thesis',data:{assertionKind:'episode-analysis',attribution:'Lionel'},style:{curved:true,width:2}});
          upsertEdge({id:'issue-thesis',type:'reference',source:'issue',target:'central-thesis',sourcePort:'right',targetPort:'left',label:'frames question answered by',data:{assertionKind:'analysis'},style:{curved:true,width:1.6}});
          upsertEdge({id:'coalition-thesis',type:'reference',source:'coalition',target:'central-thesis',sourcePort:'right',targetPort:'left',label:'models proposed realignment',data:{assertionKind:'episode-analysis',attribution:'Lionel'},style:{curved:true,width:1.6}});
          upsertEdge({id:'actor-thesis',type:'reference',source:'actor-field',target:'central-thesis',sourcePort:'right',targetPort:'bottom',label:'maps actors in',data:{assertionKind:'episode-analysis'},style:{curved:true,width:1.4}});
          upsertEdge({id:'funnel-thesis',type:'reference',source:'research-funnel',target:'central-thesis',sourcePort:'right',targetPort:'bottom',label:'explains information flow in',data:{assertionKind:'episode-analysis'},style:{curved:true,width:1.4}});
          if (byId('argument-organizations')) {
            upsertEdge({id:'orgs-thesis',type:'reference',source:'argument-organizations',target:'central-thesis',sourcePort:'left',targetPort:'right',label:'institutional context for',data:{assertionKind:'episode-analysis'},style:{curved:true,width:1.4}});
          }

          // Re-purpose person links where the episode gives them a clearer argumentative role.
          const rewire = (id, source, label, assertionKind='episode-analysis') => {
            const e = g.edges.find(x => x.id === id);
            if (!e) return;
            e.source = source;
            e.sourcePort = 'bottom';
            e.targetPort = 'top';
            e.label = label;
            e.data = {...(e.data||{}), assertionKind, attribution:'Lionel / transcript-derived analysis'};
          };
          rewire('actor-person-donald-trump','issue','political reference point');
          rewire('actor-person-candace-owens','coalition','emerging coalition voice');
          rewire('actor-person-tucker-carlson','coalition','emerging coalition voice');
          rewire('actor-person-robert-barnes','research-funnel','research contributor');
          rewire('actor-person-baron-coleman','research-funnel','research contributor');

          // Keep the remaining people as cast/context rather than inventing stronger roles.
          for (const id of ['actor-person-laura-loomer','actor-person-alex-jones','actor-person-roger-stone']) {
            const e = g.edges.find(x => x.id === id);
            if (e) e.data = {...(e.data||{}), assertionKind:'named-in-episode'};
          }

          // Give major operations explicit provenance without adding more nodes.
          const grounded = [
            ['op-turning','14:41–25:40'],
            ['op-network','32:35–58:04'],
            ['op-coalition','1:06:10–1:15:20']
          ];
          for (const [opId, range] of grounded) {
            upsertEdge({
              id:`${opId}-transcript-grounding`, type:'reference', source:opId, target:'transcript',
              sourcePort:'bottom', targetPort:'top', label:`grounded in ${range}`,
              data:{assertionKind:'provenance',timeRange:range}, style:{curved:true,width:1}
            });
          }

          // Strengthen the argument-organization branch labels if present.
          const orgRoleMap = {
            'turning-point-usa':'movement institution',
            'aipac':'political pressure actor',
            'republican-party':'coalition being reconfigured',
            'democratic-party':'old alignment contrast',
            'moral-majority':'historical coalition component'
          };
          for (const e of g.edges) {
            if (!e.target || !e.target.startsWith('org-')) continue;
            for (const [slug,label] of Object.entries(orgRoleMap)) {
              if (e.target.includes(slug)) {
                e.label = label;
                e.data = {...(e.data||{}), assertionKind:'episode-analysis',attribution:'Lionel / transcript-derived analysis'};
              }
            }
          }

          g.nodeCount = g.nodes.length;
          g.edgeCount = g.edges.length;
          g.timestamp = '2026-08-07T21:38:00-05:00';
          fs.writeFileSync(path, JSON.stringify(g, null, 2) + '\n');
          NODE
      - name: Commit graph enrichment
        run: |
          git config user.name "Mike Martinez"
          git config user.email "mike.d.martinez@gmail.com"
          git add templates/lionel/v1/example-01-associative-realignment.node
          git commit -m "Enrich Lionel example argument spine" || exit 0
          git push
