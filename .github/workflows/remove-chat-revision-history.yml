name: Remove Chat provenance revision history

on:
  push:
    branches:
      - task/remove-chat-revision-history

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/remove-chat-revision-history

      - name: Keep Chat provenance conversation-centric
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const graphPath = 'tasks/chat-node-provenance/root.node';
          const graph = JSON.parse(fs.readFileSync(graphPath, 'utf8'));
          const now = '2026-08-05T23:08:00.000Z';
          const clone = (value) => JSON.parse(JSON.stringify(value));
          const byId = new Map((graph.nodes || []).map((node) => [node.id, node]));
          const findByTitle = (type, title) => (graph.nodes || []).find((node) => node.type === type && (node.label === title || node?.data?.title === title));

          const declaration = (graph.nodes || []).find((node) => node.type === 'declaration');
          const goal = (graph.nodes || []).find((node) => node.type === 'goal');
          const cardinalityDecision = byId.get('create-chat-provenance-node-decision-one-conversation-per-node');
          const relationshipTask = findByTitle('task', 'Define Chat-to-Artifact Provenance Relationships');
          const prototypeTask = findByTitle('task', 'Build a Non-Public Prototype Graph');
          const finalTask = findByTitle('task', 'Finalize the v0.1 Contract and Integration Boundary');
          const baseDecision = cardinalityDecision || (graph.nodes || []).find((node) => node.type === 'decision');
          if (!declaration || !goal || !cardinalityDecision || !relationshipTask || !prototypeTask || !finalTask || !baseDecision) {
            throw new Error('Required Chat provenance task nodes are missing');
          }

          graph.metadata.modified = now;
          declaration.data.identity.updatedAt = now;
          declaration.data.historyPolicy = {
            exposeCommitHistory: false,
            requireRevisionAnchors: false,
            provenanceBasis: 'conversation-link-and-graph-relationship'
          };
          declaration.data.notes = Array.from(new Set([
            ...(declaration.data.notes || []),
            'Chat provenance records why a conversation mattered to the graph; it does not expose commit history or reconstruct prior graph states.'
          ]));

          goal.data.successMetrics = (goal.data.successMetrics || []).map((item) => {
            if (item === 'Each Chat node can optionally anchor its contribution to a specific graph revision, commit, node set, or captured state.') {
              return 'Chat provenance remains conversation-centric and does not expose commit history or require revision identifiers.';
            }
            return item;
          });

          relationshipTask.data.body = 'Define how each Chat node records that its single conversation created, revised, explained, reviewed, or otherwise contributed to a graph or node. Support many Chat nodes across an artifact lifetime through ordinary graph relationships, without exposing commit history or reconstructing prior graph states.';
          relationshipTask.data.acceptanceCriteria = (relationshipTask.data.acceptanceCriteria || []).map((item) => {
            if (item === 'Each provenance relationship may identify the artifact state or revision affected by that conversation.') {
              return 'Each provenance relationship identifies the affected graph or node and the contribution role, without requiring a commit or historical snapshot.';
            }
            if (item === 'Chronology can be reconstructed from event timestamps and optional explicit sequence relationships.') {
              return 'Event timestamps provide useful ordering without claiming to reconstruct a complete version history.';
            }
            return item;
          });

          prototypeTask.data.acceptanceCriteria = (prototypeTask.data.acceptanceCriteria || []).map((item) => {
            if (item === 'At least one Chat node is anchored to a specific graph revision or captured state.') {
              return 'No Chat node requires or exposes a graph commit, revision identifier, or historical snapshot.';
            }
            return item;
          });

          finalTask.data.acceptanceCriteria = (finalTask.data.acceptanceCriteria || []).map((item) => {
            if (item === 'The final contract defines the optional revision-anchor fields used to say what artifact state a conversation affected.') {
              return 'The final contract explicitly excludes commit-history exposure and revision-anchor requirements from v0.1.';
            }
            return item;
          });

          cardinalityDecision.data.body = 'A Chat node is a durable provenance record for exactly one conversation. A graph may accumulate any number of Chat nodes as it is created, revised, reviewed, or explained. Each node retains its own source, access state, captured context, timestamp, and provenance role. Conversation history is represented by multiple nodes and graph relationships, not by an array of unrelated conversations inside one node and not by exposing the graph commit history.';

          const historyDecisionId = 'create-chat-provenance-node-decision-no-commit-history';
          if (byId.has(historyDecisionId)) throw new Error('No-commit-history decision already exists');
          const historyDecision = clone(baseDecision);
          historyDecision.id = historyDecisionId;
          historyDecision.label = 'Keep Chat Provenance Separate from Commit History';
          historyDecision.position = { x: 1540, y: 1580 };
          historyDecision.data = {
            ...(historyDecision.data || {}),
            title: 'Keep Chat Provenance Separate from Commit History',
            rationale: 'The conversation link already supplies the human context. Exposing commits or reconstructing historical graph states would add complexity and disclose implementation history that the feature does not need.',
            status: 'decided',
            decidedAt: now,
            owner: 'Michael',
            supersededBy: '',
            body: 'Chat provenance links a conversation to the graph or node it influenced. It does not expose repository commit history, require revision identifiers, or attempt to recreate the exact graph state at the time of the discussion. A timestamp and provenance role provide lightweight ordering and meaning.',
            identity: { ...((historyDecision.data || {}).identity || {}), graphId: graph.metadata.graphId }
          };
          graph.nodes.push(historyDecision);

          const addEdge = (id, source, target, label) => {
            graph.edges.push({
              id,
              type: 'reference',
              source: source.id,
              target: target.id,
              sourcePort: 'left',
              targetPort: 'right',
              label,
              style: {},
              data: {}
            });
          };
          addEdge('create-chat-provenance-node-edge-no-history-constrains-relationships', historyDecision, relationshipTask, 'constrains');
          addEdge('create-chat-provenance-node-edge-no-history-constrains-prototype', historyDecision, prototypeTask, 'constrains');

          graph.timestamp = now;
          graph.nodeCount = graph.nodes.length;
          graph.edgeCount = graph.edges.length;

          const handles = (node) => new Set([
            ...((node.ports || []).map((entry) => entry.id)),
            ...((node.handles || []).map((entry) => entry.id)),
            ...((node.inputs || []).map((entry) => entry.key)),
            ...((node.outputs || []).map((entry) => entry.key))
          ].filter(Boolean));
          const nodeIds = new Set();
          for (const node of graph.nodes || []) {
            if (!node.id || nodeIds.has(node.id)) throw new Error(`Duplicate or missing node id: ${node.id}`);
            nodeIds.add(node.id);
          }
          const edgeIds = new Set();
          for (const edge of graph.edges || []) {
            if (!edge.id || edgeIds.has(edge.id)) throw new Error(`Duplicate or missing edge id: ${edge.id}`);
            edgeIds.add(edge.id);
            if (!nodeIds.has(edge.source) || !nodeIds.has(edge.target)) throw new Error(`Unresolved edge: ${edge.id}`);
            const source = graph.nodes.find((node) => node.id === edge.source);
            const target = graph.nodes.find((node) => node.id === edge.target);
            if (edge.sourcePort && !handles(source).has(edge.sourcePort)) throw new Error(`Invalid source port on ${edge.id}`);
            if (edge.targetPort && !handles(target).has(edge.targetPort)) throw new Error(`Invalid target port on ${edge.id}`);
          }

          const serialized = JSON.stringify(graph, null, 2) + '\n';
          const forbidden = [
            'optional anchors to a graph revision, commit, captured state, or affected node set',
            'At least one Chat node is anchored to a specific graph revision or captured state.',
            'optional revision-anchor fields',
            'optional artifact-revision anchor'
          ];
          for (const phrase of forbidden) {
            if (serialized.includes(phrase)) throw new Error(`Stale revision-history requirement remains: ${phrase}`);
          }
          if (!serialized.includes('Keep Chat Provenance Separate from Commit History')) throw new Error('New decision was not written');
          if (declaration.data.historyPolicy.exposeCommitHistory !== false) throw new Error('Commit history policy is not disabled');
          JSON.parse(serialized);
          fs.writeFileSync(graphPath, serialized);
          console.log(`Updated ${graphPath} with ${graph.nodes.length} nodes and ${graph.edges.length} edges`);
          NODE

      - name: Commit scoped task graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Twilite Graph Builder"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/remove-chat-revision-history.yml
          git add tasks/chat-node-provenance/root.node
          git commit -m "Keep Chat provenance separate from commit history"
          git push origin HEAD:task/remove-chat-revision-history
