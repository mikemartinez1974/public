name: Reopen type and instance presentation task

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reopen-type-instance-presentation.yml

permissions:
  contents: write

jobs:
  update-graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reopen task and repair collection projections
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/reopen_task.py
          python /tmp/reopen_task.py

      - name: Commit graph corrections and remove temporary workflow
        shell: bash
        run: |
          git config user.name "twilite-task-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/reopen-type-instance-presentation.yml
          git add tasks/type-and-instance-presentation/root.node tasks/archive/2026/q3.node tasks/root.node ideas/type-and-instance-presentation.node
          git commit -m "Reopen type and instance presentation implementation"
          git push origin HEAD:main
