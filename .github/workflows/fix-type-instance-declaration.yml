name: Fix type and instance declaration

on:
  push:
    branches:
      - complete/type-instance-presentation
    paths:
      - .github/workflows/fix-type-instance-declaration.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: complete/type-instance-presentation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct declaration and validate graph
        run: |
          node scripts/fix-type-instance-declaration.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'tasks/type-and-instance-presentation/root.node';
          const graph = JSON.parse(fs.readFileSync(path, 'utf8'));
          const declaration = graph.nodes.find((node) => node.id === 'type-instance-task-declaration');
          if (declaration.data.intent.kind !== 'task') throw new Error('Intent kind changed');
          if (declaration.data.declaration.kind !== 'graph') throw new Error('Declaration kind is not graph');
          if (declaration.data.declaration.targetMode !== 'artifact') throw new Error('Target mode is not artifact');
          if (declaration.data.declaration.artifactKind !== 'graph') throw new Error('Artifact kind is not graph');
          const root = declaration.data.declaration.surfaces.find((surface) => surface.id === 'root');
          if (!root || root.kind !== 'port' || root.portNodeId !== 'type-instance-task-root-port' || root.viewNodeId !== 'type-instance-task-root-port') {
            throw new Error('Root surface is invalid');
          }
          const ids = new Set(graph.nodes.map((node) => node.id));
          for (const edge of graph.edges) {
            if (!ids.has(edge.source) || !ids.has(edge.target)) throw new Error(`Dangling edge ${edge.id}`);
          }
          console.log('Corrected task declaration is valid.');
          NODE

      - name: Commit corrected declaration
        run: |
          git config user.name "Twilite Graph Maintainer"
          git config user.email "actions@github.com"
          git add tasks/type-and-instance-presentation/root.node
          git commit -m "Correct task graph declaration kind"
          git push origin HEAD:complete/type-instance-presentation
