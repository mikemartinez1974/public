name: Complete type and instance presentation task

on:
  push:
    branches:
      - complete/type-instance-presentation-native

permissions:
  contents: write

jobs:
  update-task-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: complete/type-instance-presentation-native

      - name: Complete task graph
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('tasks/type-and-instance-presentation/root.node')
          graph = json.loads(path.read_text(encoding='utf-8'))

          completed_at = '2026-08-05T15:45:00.000Z'
          implementation_pr = 'https://github.com/TwiliteLLC/twilite/pull/1'
          implementation_commit = 'https://github.com/TwiliteLLC/twilite/commit/bf640b0e1c45c3af94023da614e963032bba41c8'
          validation_run = 'https://github.com/TwiliteLLC/twilite/actions/runs/31021267652'
          evidence = [implementation_pr, implementation_commit, validation_run]

          graph['metadata']['description'] = 'Completed implementation task graph for type and instance presentation in the Twilite application.'
          graph['metadata']['version'] = '1.2.0'
          graph['metadata']['modified'] = completed_at
          graph['metadata']['tags'] = ['task', 'completed']

          nodes = {node['id']: node for node in graph.get('nodes', [])}
          declaration = nodes['type-instance-task-declaration']['data']
          declaration['identity']['version'] = '1.2.0'
          declaration['identity']['updatedAt'] = completed_at
          declaration['declaration']['surfaces'][0]['memo'] = 'Canonical completed-task entry surface.'
          declaration['completion'] = {
            'status': 'completed',
            'completedAt': completed_at,
            'reason': 'The contract was rebuilt directly against the current Twilite codebase and merged after focused tests and a successful production build.',
            'implementation': {
              'repo': 'github://TwiliteLLC/twilite',
              'branch': 'dev-master',
              'pullRequest': implementation_pr,
              'commit': implementation_commit,
              'validationRun': validation_run,
              'status': 'merged'
            },
            'validation': {
              'focusedTests': {'passed': 15, 'failed': 0},
              'productionBuild': 'passed',
              'browserPrerender': 'passed',
              'fullSuiteBaseline': {
                'passed': 153,
                'failed': 3,
                'status': 'pre-existing failures unrelated to this implementation'
              }
            },
            'prototype': {
              'repo': 'github://mikemartinez1974/nodegraph-editor',
              'commit': 'https://github.com/mikemartinez1974/nodegraph-editor/commit/45ebe4d708c77c3b95a6370febe0d088da908351',
              'pullRequest': 'https://github.com/mikemartinez1974/nodegraph-editor/pull/1',
              'status': 'reference-only'
            },
            'failedPort': {
              'repo': 'github://TwiliteLLC/twilite',
              'commit': '886a66c9fbbb6399c278f90a4e51e9f4decf28e7',
              'failure': 'ReferenceError: ViewPlugin is not defined while prerendering /browser.',
              'releaseActivated': False,
              'status': 'superseded by the native implementation'
            }
          }

          root_port = nodes['type-instance-task-root-port']['data']
          root_port['description'] = 'Completed implementation task for the Type and Instance Presentation contract.'

          goal = nodes['type-instance-task-goal']['data']
          goal['status'] = 'done'
          goal['outcome'] = 'The native implementation is merged into Twilite dev-master with node specimens, edge specimens, and a first-class Document node.'
          goal['evidence'] = evidence
          goal['health'] = 'done'
          goal['nextAction'] = 'Deploy dev-master and perform a visual smoke check in Twilite.'
          goal.pop('blockedReason', None)

          for node_id in [
            'type-instance-task-document',
            'type-instance-task-legend',
            'type-instance-task-elements',
            'type-instance-task-edges',
            'type-instance-task-compat'
          ]:
            data = nodes[node_id]['data']
            data['status'] = 'done'
            data['health'] = 'done'
            data['nextAction'] = 'No remaining implementation action.'
            data['evidence'] = evidence
            data.pop('blockedReason', None)

          nodes['type-instance-task-decision']['data']['implementationStatus'] = 'done'

          notes = nodes['type-instance-task-notes']['data']
          notes['markdown'] = '''# Type and Instance Presentation

**Status:** Completed and merged

The contract is now implemented in the repository that powers Twilite: **the Legend identifies stable types, while Elements presents actual node and edge instances.**

## Production implementation

- Repository: `github://TwiliteLLC/twilite`
- Branch: `dev-master`
- Pull request: `https://github.com/TwiliteLLC/twilite/pull/1`
- Merge commit: `bf640b0e1c45c3af94023da614e963032bba41c8`
- Validation run: `https://github.com/TwiliteLLC/twilite/actions/runs/31021267652`

## Delivered

- Native `document` nodes using `data.document: { format, content }` with legacy content compatibility.
- Bounded node specimens in Elements, including class-backed `node.web.icon` views and stable glyph fallbacks.
- Compact edge specimens using actual edge styling, with the semantic label on the specimen and endpoints as secondary context.
- Existing CodeMirror source editing, filtering, tabs, resizing, clustering, and browser behavior preserved.

## Validation

- Focused tests: **15 passed, 0 failed**.
- Production Next.js build: **passed**.
- `/browser` prerender: **passed**.
- Full repository baseline: **153 passed, 3 pre-existing unrelated failures**.

## Historical detour

The earlier implementation in `mikemartinez1974/nodegraph-editor` remains a reference prototype. The failed whole-file port at `886a66c9fbbb6399c278f90a4e51e9f4decf28e7` never activated and has been superseded by the native implementation.'''
          notes['completedAt'] = completed_at
          notes.pop('reopenedAt', None)

          path.write_text(json.dumps(graph, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit task graph completion
        run: |
          if git diff --quiet; then
            echo "Task graph already complete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/type-and-instance-presentation/root.node
          git commit -m "Complete type and instance presentation task graph"
          git push origin HEAD:complete/type-instance-presentation-native
