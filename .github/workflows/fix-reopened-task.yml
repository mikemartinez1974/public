name: Normalize reopened task timestamps

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-reopened-task.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove stale completion timestamps
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix_reopened.py
          sed -i 's/, none)/, None)/' /tmp/fix_reopened.py
          python /tmp/fix_reopened.py
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name "twilite-task-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-reopened-task.yml
          git add tasks/type-and-instance-presentation/root.node
          git commit -m "Remove stale completion timestamps from reopened task"
          git push origin HEAD:main
