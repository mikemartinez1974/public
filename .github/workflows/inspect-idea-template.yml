name: Generate chat node provenance idea

on:
  push:
    branches:
      - idea/chat-node-provenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive idea graph from canonical template
        shell: bash
        run: |
          cat > /tmp/generate-chat-node-idea.js <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const TEMPLATE_PATH = 'templates/idea-template/root.node';
          const OUTPUT_PATH = 'ideas/chat-node-provenance.node';
          const OLD_ID = 'idea-template';
          const GRAPH_ID = 'chat-node-provenance';
          const TITLE = 'Chat Nodes as Graph Provenance';
          const DESCRIPTION = 'Give graphs a first-class node that links to the conversation that created, revised, or explained them.';
          const NOW = '2026-08-05T21:33:00.000Z';

          const graph = JSON.parse(fs.readFileSync(TEMPLATE_PATH, 'utf8'));

          const retarget = (value) => {
            if (Array.isArray(value)) return value.map(retarget);
            if (value && typeof value === 'object') {
              return Object.fromEntries(Object.entries(value).map(([key, child]) => [key, retarget(child)]));
            }
            if (typeof value !== 'string') return value;
            if (value === OLD_ID) return GRAPH_ID;
            if (value.startsWith(`${OLD_ID}-`)) return `${GRAPH_ID}${value.slice(OLD_ID.length)}`;
            return value;
          };

          const derived = retarget(graph);

          derived.metadata = {
            ...derived.metadata,
            title: TITLE,
            description: DESCRIPTION,
            graphId: GRAPH_ID,
            version: '0.1.0',
            kind: 'idea',
            created: NOW,
            modified: NOW,
            author: 'Michael Martinez',
            tags: ['idea', 'chat', 'provenance', 'conversation', 'generated-artifacts', 'sharing'],
            preferredViewer: 'https://twilite.zone'
          };

          const byType = new Map();
          for (const node of derived.nodes || []) {
            if (!byType.has(node.type)) byType.set(node.type, []);
            byType.get(node.type).push(node);
            if (node?.data?.identity && typeof node.data.identity === 'object') {
              node.data.identity.graphId = GRAPH_ID;
            }
          }

          const one = (type) => {
            const nodes = byType.get(type) || [];
            if (nodes.length !== 1) throw new Error(`Expected exactly one ${type} node, found ${nodes.length}`);
            return nodes[0];
          };

          const declaration = one('declaration');
          declaration.label = `${TITLE} Declaration`;
          declaration.data.identity = {
            ...declaration.data.identity,
            graphId: GRAPH_ID,
            name: TITLE,
            version: '0.1.0',
            description: DESCRIPTION,
            createdAt: NOW,
            updatedAt: NOW
          };
          declaration.data.intent = {
            kind: 'idea',
            scope: 'shared',
            artifactKind: 'idea'
          };
          declaration.data.declaration = {
            ...declaration.data.declaration,
            kind: 'idea',
            artifactKind: 'idea',
            targetMode: 'artifact',
            defaultSurfaceId: 'root',
            surfaces: [{
              id: 'root',
              kind: 'port',
              label: TITLE,
              memo: 'Canonical entry surface for the Chat Node provenance idea.',
              portNodeId: `${GRAPH_ID}-root-port`,
              viewNodeId: `${GRAPH_ID}-root-port`,
              exposes: {
                views: { mode: 'allow' },
                declarations: { mode: 'allow' }
              }
            }]
          };

          const rootPort = one('port');
          rootPort.label = TITLE;
          rootPort.data = {
            ...rootPort.data,
            identity: {
              graphId: GRAPH_ID,
              portId: 'root',
              name: TITLE
            },
            title: TITLE,
            purpose: 'Preserve the conversation that produced a graph as inspectable provenance beside the artifact.',
            renderShape: { kind: 'svg' },
            svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Chat Nodes as Graph Provenance"><defs><linearGradient id="chat-provenance-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset=".55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#6d28d9"/></linearGradient></defs><rect x="5" y="5" width="550" height="310" rx="32" fill="url(#chat-provenance-bg)" stroke="#c4b5fd" stroke-width="3"/><path d="M126 76h190a28 28 0 0 1 28 28v64a28 28 0 0 1-28 28H210l-48 35 12-35h-48a28 28 0 0 1-28-28v-64a28 28 0 0 1 28-28z" fill="#172554" stroke="#bfdbfe" stroke-width="4"/><circle cx="153" cy="136" r="9" fill="#93c5fd"/><circle cx="202" cy="136" r="9" fill="#c4b5fd"/><circle cx="251" cy="136" r="9" fill="#f0abfc"/><path d="M355 111h54M409 111l34 40M409 111l34-39M443 72h52M443 151h52" fill="none" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/><circle cx="409" cy="111" r="13" fill="#8b5cf6" stroke="#f5f3ff" stroke-width="3"/><circle cx="495" cy="72" r="13" fill="#2563eb" stroke="#dbeafe" stroke-width="3"/><circle cx="495" cy="151" r="13" fill="#db2777" stroke="#fce7f3" stroke-width="3"/><text x="280" y="252" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="30" font-weight="850">Chat Provenance</text><text x="280" y="282" text-anchor="middle" fill="#ddd6fe" font-family="system-ui,sans-serif" font-size="15">Conversation → Context → Graph</text></svg>`,
            altText: 'A conversation bubble connected to graph nodes, representing the originating chat preserved as graph provenance.',
            view: {
              intent: 'node',
              payload: 'node.web.summary',
              label: TITLE
            },
            payload: 'node.web.summary',
            intent: 'node',
            key: 'node.web.summary',
            viewRole: 'summary',
            viewKind: 'display',
            semanticLevel: 'summary',
            visibilityRole: 'browser',
            description: 'A first-class Chat node would let a graph retain the conversation that conceived or revised it, with explicit access and snapshot semantics.'
          };

          const instructions = one('markdown');
          instructions.label = 'Reading This Idea';
          instructions.data = {
            ...instructions.data,
            identity: { graphId: GRAPH_ID },
            title: 'Reading This Idea',
            markdown: '# Reading This Idea\n\nThis graph frames a first-class **Chat node** as provenance, not merely another hyperlink. Follow the semantic edges from the loss of conversational context toward a node contract that records access mode, snapshot scope, durable summary, and the artifacts produced by the conversation.\n\nThe idea deliberately separates a private owner link, a shared snapshot, and a locally archived excerpt so the graph never implies more access or permanence than actually exists.'
          };

          const content = {
            idea: {
              title: 'Graphs Should Preserve Their Originating Conversations',
              statement: 'A graph should be able to contain a first-class Chat node that links back to the conversation that created, revised, or explained it, preserving provenance beside the artifact.',
              status: 'framed',
              confidence: 'plausible',
              notes: 'The graph is the durable artifact; the Chat node explains how it came to exist and where its reasoning can be revisited.'
            },
            'idea-problem': {
              title: 'Generated Artifacts Lose Their Reasoning Trail',
              statement: 'When a conversation produces a graph, the finished graph usually retains none of the discussion, decisions, corrections, or intent that shaped it.',
              impact: 'Authors, collaborators, reviewers, and agents must reconstruct why the graph exists, repeat old discussions, or trust an artifact whose provenance has vanished.',
              urgency: 'medium'
            },
            'idea-audience': {
              title: 'Graph Authors, Collaborators, Reviewers, and Agents',
              description: 'People and agents who create, inherit, inspect, revise, or continue work on a graph produced through conversation.',
              needs: 'They need a quick way to revisit the source discussion while clearly understanding whether it is private, shared, mutable, revoked, or locally archived.'
            },
            'idea-proposed-approach': {
              title: 'A First-Class Chat Node with Explicit Provenance Semantics',
              description: 'Add a Chat node type with provider, title, source URL, access mode, captured time, summary or excerpt, and produced-artifact references. Render the access state visibly and connect the conversation to what it created.',
              differentiator: 'Unlike a generic URL node, it describes the relationship between conversation and artifact, distinguishes access modes, and can retain useful local context even when the external conversation cannot be opened.'
            },
            'idea-question': {
              title: 'What Can Twilite Reliably Promise About a Linked Conversation?',
              question: 'Which conversation link, snapshot, export, and access behaviors are stable enough to represent without exposing private context or implying permanence that the provider does not guarantee?',
              status: 'open',
              answer: ''
            },
            'idea-assumption': {
              title: 'Conversational Provenance Will Remain Useful After Creation',
              statement: 'Users and agents will value revisiting the originating conversation enough to keep Chat nodes, and the node can communicate link scope clearly enough to avoid becoming a privacy trap.',
              importance: 'critical',
              status: 'untested'
            },
            'idea-research': {
              title: 'Conversation Link and Snapshot Semantics',
              findings: 'Compare private owner links, shared conversation snapshots, exported transcripts, revocation behavior, provider portability, and locally stored summaries or excerpts before defining the durable contract.',
              sourceUrl: '',
              sourceType: 'product-documentation'
            },
            'idea-evidence': {
              title: 'The Provenance Need Appeared During Real Graph Work',
              observation: 'While discussing how a shared chat exposes conversation history, the immediate product idea was to place a node in a generated graph that links back to the chat that created it.',
              kind: 'observation',
              strength: 'moderate',
              sourceRef: 'Current Twilite design conversation, 2026-08-05'
            },
            'idea-alternative': {
              title: 'Use an Ordinary URL or Markdown Node',
              description: 'Store the conversation link in a generic hyperlink, markdown card, or graph note without introducing a dedicated type.',
              tradeoffs: 'This is available immediately and requires no new runtime behavior, but it loses access badges, snapshot semantics, provenance relationships, provider metadata, and durable fallback context.'
            },
            'idea-risk': {
              title: 'A Friendly Chat Card Could Expose the Boiler Room',
              description: 'A shared conversation may contain personal remarks, private project details, deployment paths, credentials-adjacent information, or unrelated history. External links may also be revoked, private, or changed.',
              likelihood: 'high',
              impact: 'high',
              mitigation: 'Never auto-share. Require an explicit access mode, preview what will be exposed, show a visible privacy badge, and allow a local summary or selected excerpt instead of the full conversation.'
            },
            'idea-next-step': {
              title: 'Define and Prototype the Minimal Chat Node Contract',
              action: 'Specify the smallest Chat node data contract and prototype it with manually pasted private and shared links in a non-public graph before adding provider-specific integration.',
              expectedEvidence: 'The prototype should distinguish access modes at a glance, open valid links, remain informative when a link is inaccessible, and make the produced-artifact relationship obvious.',
              status: 'todo'
            }
          };

          for (const [type, values] of Object.entries(content)) {
            const node = one(type);
            node.data = {
              ...node.data,
              ...values,
              identity: { graphId: GRAPH_ID }
            };
          }

          derived.nodeCount = derived.nodes.length;
          derived.edgeCount = derived.edges.length;
          derived.timestamp = NOW;

          const ids = new Set();
          for (const node of derived.nodes) {
            if (!node.id) throw new Error('Node without id');
            if (ids.has(node.id)) throw new Error(`Duplicate node id: ${node.id}`);
            ids.add(node.id);
          }
          for (const edge of derived.edges) {
            if (!ids.has(edge.source)) throw new Error(`Missing edge source ${edge.source} for ${edge.id}`);
            if (!ids.has(edge.target)) throw new Error(`Missing edge target ${edge.target} for ${edge.id}`);
          }
          const rootSurface = declaration.data.declaration.surfaces.find((surface) => surface.id === 'root');
          const declaredRoot = derived.nodes.find((node) => node.id === rootSurface.portNodeId);
          if (!declaredRoot || declaredRoot.type !== 'port') throw new Error('Declaration root surface does not resolve to a primitive port');

          for (const type of Object.keys(content)) {
            const node = one(type);
            if (node.data.definitionKey !== type) throw new Error(`${type} definitionKey mismatch`);
            if (node.data?._classBinding?.key !== type) throw new Error(`${type} class binding mismatch`);
            if (!String(node.data?._classBinding?.sourceRef || '').includes('/templates/idea-template/classes/nodes/')) {
              throw new Error(`${type} lost its canonical class ref`);
            }
          }

          const edgeAuthority = derived.edges.filter((edge) => edge.label === 'edge authority');
          if (edgeAuthority.length !== 10) throw new Error(`Expected 10 edge authority edges, found ${edgeAuthority.length}`);

          fs.mkdirSync(path.dirname(OUTPUT_PATH), { recursive: true });
          fs.writeFileSync(OUTPUT_PATH, `${JSON.stringify(derived, null, 2)}\n`);
          JSON.parse(fs.readFileSync(OUTPUT_PATH, 'utf8'));
          console.log(`Generated ${OUTPUT_PATH} with ${derived.nodes.length} nodes and ${derived.edges.length} edges.`);
          NODE

          node /tmp/generate-chat-node-idea.js
          rm .github/workflows/inspect-idea-template.yml

      - name: Commit generated graph
        shell: bash
        run: |
          git config user.name "Twilite Graph Builder"
          git config user.email "actions@users.noreply.github.com"
          git add ideas/chat-node-provenance.node .github/workflows/inspect-idea-template.yml
          git commit -m "Add chat node provenance idea graph"
          git push origin HEAD:idea/chat-node-provenance
