name: Fix chat node idea contract

on:
  push:
    branches:
      - idea/chat-node-provenance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical idea-template skill and validate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'ideas/chat-node-provenance.node';
          const graph = JSON.parse(fs.readFileSync(file, 'utf8'));
          const declaration = graph.nodes.find((node) => node.type === 'declaration');
          if (!declaration) throw new Error('Missing declaration');
          declaration.data.dependencies.skills = ['idea-template'];

          const ids = new Set();
          for (const node of graph.nodes) {
            if (!node.id || ids.has(node.id)) throw new Error(`Invalid or duplicate node id: ${node.id}`);
            ids.add(node.id);
          }
          for (const edge of graph.edges) {
            if (!ids.has(edge.source) || !ids.has(edge.target)) throw new Error(`Broken edge endpoint: ${edge.id}`);
          }
          const surface = declaration.data.declaration.surfaces.find((entry) => entry.id === 'root');
          const rootPort = graph.nodes.find((node) => node.id === surface?.portNodeId);
          if (!rootPort || rootPort.type !== 'port') throw new Error('Root surface is not a primitive port');
          const semanticTypes = ['idea','idea-problem','idea-audience','idea-proposed-approach','idea-question','idea-assumption','idea-research','idea-evidence','idea-alternative','idea-risk','idea-next-step'];
          for (const type of semanticTypes) {
            const node = graph.nodes.find((entry) => entry.type === type);
            if (!node) throw new Error(`Missing ${type}`);
            if (node.data.definitionKey !== type || node.data?._classBinding?.key !== type) throw new Error(`Binding mismatch for ${type}`);
            if (!String(node.data?._classBinding?.sourceRef || '').includes('/templates/idea-template/classes/nodes/')) throw new Error(`Class ref mismatch for ${type}`);
          }
          const authorities = graph.edges.filter((edge) => edge.label === 'edge authority');
          if (authorities.length !== 10) throw new Error(`Expected 10 edge authorities, got ${authorities.length}`);
          if (graph.nodes.length !== 35 || graph.edges.length !== 22) throw new Error(`Unexpected graph size ${graph.nodes.length}/${graph.edges.length}`);
          fs.writeFileSync(file, `${JSON.stringify(graph, null, 2)}\n`);
          JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log('Validated chat node provenance graph contract.');
          NODE
          rm .github/workflows/fix-chat-node-idea.yml

      - name: Commit corrected graph
        shell: bash
        run: |
          git config user.name "Twilite Graph Builder"
          git config user.email "actions@users.noreply.github.com"
          git add ideas/chat-node-provenance.node .github/workflows/fix-chat-node-idea.yml
          git commit -m "Preserve canonical idea template skill"
          git push origin HEAD:idea/chat-node-provenance
